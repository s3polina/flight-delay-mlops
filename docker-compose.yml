x-pipeline-env: &pipeline-env
  RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
  DATABASE_URL: postgresql://postgres:postgres@db:5432/flight_delay
  TASKS_QUEUE: ${TASKS_QUEUE:-flight.tasks}
  QUEUE_MAX_LENGTH: ${QUEUE_MAX_LENGTH:-100}
  DELIVERY_LIMIT: ${DELIVERY_LIMIT:-3}
  INFERENCE_DELAY_SEC: ${INFERENCE_DELAY_SEC:-0.2}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  PREFETCH_COUNT: ${PREFETCH_COUNT:-4}
  RUN_LABEL: ${RUN_LABEL:-manual}
  METRICS_DIR: /app/experiments/results
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-always_on}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-5000}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_RESOURCE_ATTRIBUTES: service.version=0.1.0,deployment.environment.name=dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
    environment:
      <<: *pipeline-env
      OTEL_SERVICE_NAME: flight-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  worker:
    build:
      context: .
    command:
      [
        "uv", "run", "--no-sync", "uvicorn", "flight_delay_mlops.worker:app",
        "--host", "0.0.0.0", "--port", "8001",
        "--timeout-graceful-shutdown", "40",
      ]
    environment:
      <<: *pipeline-env
      OTEL_SERVICE_NAME: flight-worker
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: flight-delay-classifier
      MODEL_ALIAS: champion
      GRACEFUL_TIMEOUT_SEC: "30"
    ports:
      - "8001-8002:8001"
    volumes:
      - ./experiments/results:/app/experiments/results
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 45s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  source:
    build:
      context: .
    command: ["uv", "run", "--no-sync", "python", "-m", "flight_delay_mlops.source"]
    environment:
      <<: *pipeline-env
      OTEL_SERVICE_NAME: flight-source
      SOURCE_DATA_PATH: /app/data/flights_2013.csv
      SOURCE_MAX_TASKS: ${SOURCE_MAX_TASKS:-0}
      SOURCE_DURATION_SEC: ${SOURCE_DURATION_SEC:-0}
    volumes:
      - ./data:/app/data:ro
      - ./experiments/results:/app/experiments/results
    depends_on:
      rabbitmq:
        condition: service_healthy
    profiles: ["load"]
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: flight_delay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flight_delay"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.1-management
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec docker-entrypoint.sh rabbitmq-server"]
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging

  # ---------- MLflow ----------

  # Backend Store: эксперименты, runs, параметры, метрики, датасеты, Model Registry
  mlflow-db:
    image: postgres:17
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Tracking Server + UI. Клиенты общаются только с ним (http://localhost:5000).
  # Backend Store  - PostgreSQL mlflow-db (метаданные),
  # Artifact Store - отдельный том mlflow_artifacts, смонтированный в /mlartifacts (файлы).
  # Сервер сам принимает и отдаёт артефакты (--serve-artifacts).
  mlflow:
    build:
      context: ./mlflow-server
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1:*,mlflow,mlflow:*"
    volumes:
      - mlflow_artifacts:/mlartifacts
    ports:
      - "5001:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    profiles: ["logs", "observability"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.6.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-flight-delay-mlops}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles: ["logs", "observability"]
    depends_on: [loki]
    mem_limit: 128m

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    profiles: ["traces", "observability"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 20s
      timeout: 10s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    profiles: ["traces", "metrics", "observability"]
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: ["metrics", "observability"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    profiles: ["metrics", "observability"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 128m

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    profiles: ["observability"]
    depends_on: [loki, tempo, prometheus]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mlflow_db_data:
  mlflow_artifacts:
  rabbitmq_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
