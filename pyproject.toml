[project]
name = "flight-delay-mlops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "s3polina", email = "polyastrinadkina@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
flight-delay-mlops = "flight_delay_mlops:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers[rabbitmq]>=4.9",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    # inference: загрузка модели из MLflow (без сервера и UI)
    "mlflow-skinny>=3.10,<4",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    # брокер сообщений: API, источник задач и воркер
    "faststream[rabbit]>=0.6,<0.7",
    "psutil>=6.0",
]
# EDA, обучение и регистрация моделей (скрипты из папки ml/)
ml = [
    "mlflow>=3.10,<4",
    "matplotlib>=3.9",
    "nycflights13>=0.0.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: тесты на реальном RabbitMQ через Testcontainers (нужен Docker)",
]
