apiVersion: 1
groups:
  - orgId: 1
    name: Pipeline Alerts
    folder: mlops
    interval: 10s
    rules:
      - uid: queue-pressure
        title: Queue above 90 percent
        condition: B
        for: 1m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: RabbitMQ queue stays above 90% of 100 message limit
        data:
          - refId: A
            relativeTimeRange: {from: 60, to: 0}
            datasourceUid: prometheus
            model:
              expr: 'rabbitmq_detailed_queue_messages_ready{queue="flight.tasks"} / 100'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {type: gt, params: [0.9]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: dlq-present
        title: Dead letter queue has messages
        condition: B
        for: 10s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: {from: 60, to: 0}
            datasourceUid: prometheus
            model:
              expr: 'sum(rabbitmq_detailed_queue_messages_ready{queue=~".*dlq.*|.*dead.*"}) or vector(0)'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: {from: 0, to: 0}
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
