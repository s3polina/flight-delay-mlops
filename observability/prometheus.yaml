global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: flight-api
    static_configs:
      - targets: [app:8000]
    metrics_path: /metrics
  - job_name: flight-worker
    static_configs:
      - targets: [worker:8001]
    metrics_path: /metrics
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
